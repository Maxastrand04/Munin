[project]
name = "munin"
version = "0.1.0"
description = "Turn a recorded Swedish lecture into a mindmap that links back into the lecture."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "mcp>=1.0",
    "mini-racer>=0.14.1",
    "onnx-asr[cpu,hub]>=0.12.0,<0.13",
    "platformdirs>=4.0",
    "pypdfium2>=5.14.0",
    "sentencepiece>=0.2.2",
    "yt-dlp>=2026.10.21",
]

[project.scripts]
munin = "munin.mcp_server:main"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/munin"]

[tool.ruff]
extend-exclude = ["src/munin/core/_vendor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads the real Pianissimo model",
    "network: downloads from YouTube or KTH Play with the real downloader",
]
