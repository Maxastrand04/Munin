[project]
name = "klang-notes"
version = "0.1.0"
description = "Turn a recorded Swedish lecture into a mindmap that links back into the lecture."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "mcp>=1.0",
    "onnx-asr[cpu,hub]>=0.12.0",
    "platformdirs>=4.0",
    "yt-dlp>=2026.10.21",
]

[project.scripts]
klang-notes-mcp = "klang_notes.mcp_server:main"

[dependency-groups]
dev = [
    "playwright>=1.64.1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/klang_notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads the real Pianissimo model",
    "network: downloads from YouTube with the real downloader",
]
